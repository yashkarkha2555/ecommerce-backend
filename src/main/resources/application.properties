spring.application.name=Complete E-commerce Backend System
# PostgreSQL connection settings.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:yourpassword}

# Hibernate schema management (update keeps existing data and applies changes).
spring.jpa.hibernate.ddl-auto=update
# SQL logging for development visibility.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit PostgreSQL dialect for Hibernate.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:myVeryVeryStrongSecretKeyForJwtAuthentication12345}
jwt.expiration-ms=86400000